  <style id = "mainColors">
    :root {
    --background-image:url("../assets/backgroundDark.j");

  /* Main Colors */
  --black:#101010;
  --white:#f0f0f0;
  --dark-grey:#232323;
  --dark-grey-1: #3c3c3c;
  --dark-grey-2: #4c4c4c;
  --light-grey:#d9d9d9;
  --light-grey-1:#c1c1c1;
  --light-grey-2:#ababab;
  --primary: #ff7800;

  --primary-saturated: #ff9822;
  --primary-text:#f1f1f1;
  --primary-text-black:#010101;
  --secondary:#b22645;
  --secondary-saturated:#f6505d;
  --purew:white;
  --pureb:black;
  --clear:rgba(0,0,0,0)
    }
  </style>
  <style id="colorHandlers">
:root {  
--white_black:                      var(--white);
--primary-text-black_primary-text:  var(--primary-text-black);
--purew_dark-grey:                  var(--purew);
--purew_black:                      var(--purew);
--purew_clear:                      var(--purew);
--light-grey-2_black:               var(--light-grey-2);
--light-grey_dark-grey:             var(--light-grey);
--light-grey-2_clear:               var(--light-grey-2);
--white_dark-grey-1:                var(--white);
--light-grey_dark-grey-2:           var(--light-grey);
--light-grey-1_dark-grey-1:         var(--light-grey-1);
--light-grey-1_dark-grey-2:         var(--light-grey-1);
--light-grey-1_clear:               var(--light-grey-1);
--light-grey-1_black:               var(--light-grey-1);
--purew_pureb:                      var(--purew);
--secondary-saturated_secondary:    var(--secondary-saturated);
--white_dark-grey:                  var(--white);
--light-grey-2_dark-grey-2:         var(--light-grey-2);
--dark-grey-2_black:                var(--dark-grey-2);
--light-grey_dark-grey-1:           var(--light-grey);
--light-grey_clear:           var(--light-grey);
--light-grey-1_dark-grey:           var(--light-grey);
}
